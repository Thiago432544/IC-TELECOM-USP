# Copie para config.toml e preencha os segredos. config.toml NÃO vai para o git.
summary_hour = 8

[paths]
images = 'D:\SPA_Data\Imagens_Porto'
log = 'D:\SPA_Data\LOG_connections.txt'
data = 'C:\monitor\data'            # SQLite, outbox, logs do próprio monitor

[cameras.102]
save_every = 10                     # servidor grava 1 a cada 10 frames
[cameras.105]
save_every = 1
[cameras.106]
save_every = 10

[telegram]
enabled = false                     # true depois de criar o bot no @BotFather
token = "COLOQUE_O_TOKEN_AQUI"
chat_id = "COLOQUE_O_CHAT_ID_AQUI"

[cpe]
enabled = false                     # true depois de calibrar com: python -m monitor.cpe --probe
url = "http://192.168.10.101/"
username = ""
password = ""
rsrp_re = '(-?\d+)\s*dBm\s*\(RSRP\)'
rsrq_re = '(-?\d+)\s*dB\s*\(RSRQ\)'
interval_s = 60

[alerts]
disk_min_gb = 60.0
down_after_s = 180
degraded_ratio = 0.5
degraded_after_s = 600
flap_count = 5
flap_window_s = 900
realert_s = 1800
link_rsrp_min = -110.0
link_rsrq_min = -15.0
link_after_s = 300

# Auto-alarme: excecoes de worker na ultima hora a partir das quais o monitor
# avisa que pode ter cegado. Erro avulso nao acorda ninguem; worker que estoura
# todo ciclo passa de 3 em minutos.
worker_errors_max = 3

# Radio do CPE da PROPRIA camera (rsrp_cam/sinr, lidos pela Rasp), e nao o do
# lado do SPA, que fica a ~400 m da estacao, le saturado e nao diz nada sobre
# as cameras. Abaixo de -100 dBm a cobertura entra em risco; abaixo de 5 dB de
# SINR a vazao desaba, porque e' o SINR que decide a modulacao.
# O RSRQ fica de fora de proposito: nesta rede privada quase vazia ele mede
# ocupacao de celula, nao qualidade de caminho - vive colado perto do teto de
# -3 dB e quase nao se mexe. Ver o diario de 09/09.
radio_rsrp_min = -100.0
radio_sinr_min = 5.0
radio_after_s = 300

[charts]
outage_min_s = 0    # 0 = piso automatico pela janela (30min->30s, 24h->5min)

[radio]
# RSRP/RSRQ/SINR do CPE de cada camera. O PC nao alcanca a LAN do radio
# (192.168.11.x): quem le o CPE e' o deploy/rasp/radio_log.py, que roda na Rasp
# por cron; o monitor so busca a ultima linha do CSV dele, por SSH.
# Precisa de chave SSH do PC para a Rasp - com BatchMode, sem chave nao ha
# leitura e o /status diz isso, em vez de pendurar pedindo senha.
enabled = false
interval_s = 60
ssh_user = "pi"
csv = "/home/pi/Desktop/Porto_de_Santos_2025/PRINCIPAL/radio.csv"
max_atraso_s = 600          # amostra mais velha que isto nao entra

[radio.cameras]
# camera = host que o PC alcanca (nao o IP interno do radio)
105 = "192.168.10.105"

[panel]
port = 8080
